[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
lib_deps = 
	DWM1000
	; wollewald/MPU9250_WE@^1.2.17
	; thotro/DW1000@^0.9
	; https://github.com/geraicerdas/Cerdas-UWB-Tracker.git
lib_ldf_mode = deep+